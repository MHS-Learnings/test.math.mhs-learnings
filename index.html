                                    </div>
                                    <div className="bg-nmsc-bg p-3 rounded-xl border border-nmsc-border">
                                        <span className="text-[10px] text-nmsc-textSecondary block">Percentage</span>
                                        <strong className="text-emerald-400 text-base">{searchedResult.percentage}%</strong>
                                    </div>
                                    <div className="bg-nmsc-bg p-3 rounded-xl border border-nmsc-border">
                                        <span className="text-[10px] text-nmsc-textSecondary block">National Merit Rank</span>
                                        <strong className="text-amber-400 text-base">#{searchedResult.rank || '42'}</strong>
                                    </div>
                                </div>

                                {/* Multi-Subject Biology Breakdown */}
                                {searchedResult.subjectBreakdown && (
                                    <div className="space-y-2 pt-2">
                                        <h4 className="text-xs font-bold text-white uppercase tracking-wider">Biology Domain Breakdown:</h4>
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                            {searchedResult.subjectBreakdown.map((sb, idx) => (
                                                <div key={idx} className="bg-nmsc-bg p-3 rounded-xl border border-nmsc-border text-xs">
                                                    <span className="text-[10px] text-nmsc-textSecondary block truncate">{sb.subject}</span>
                                                    <span className="font-mono font-bold text-white">{sb.marks}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="pt-4 border-t border-nmsc-border flex flex-col sm:flex-row justify-between items-center gap-3">
                                    <div className="text-[10px] text-nmsc-textSecondary">
                                        Certificate ID: <span className="text-purple-400 font-mono font-bold">{searchedResult.certId || 'BIO-2026-GEN'}</span>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => window.print()} className="px-4 py-2 bg-nmsc-bg border border-nmsc-border text-xs text-white font-bold rounded-lg hover:bg-nmsc-border">
                                            🖨️ Print Scorecard
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="p-8 border border-dashed border-nmsc-border rounded-2xl text-center bg-nmsc-bg/40 text-nmsc-textSecondary text-xs">
                                🔍 Enter a Roll Number or Student Name above to load the official scorecard.
                            </div>
                        )}
                    </div>

                    {/* FULL MERIT LIST TABLE - SCHOOL/ACADEMY COLUMN REMOVED */}
                    <div className="space-y-6">
                        <div className="text-center">
                            <h2 className="text-xs font-bold text-nmsc-cyan uppercase tracking-widest">Official Leaderboard</h2>
                            <p className="text-2xl font-extrabold text-white">Biology Championship National Merit Rankings</p>
                        </div>

                        <div className="bg-nmsc-surface border border-nmsc-border rounded-2xl overflow-hidden shadow-xl">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-xs">
                                    <thead className="bg-nmsc-card border-b border-nmsc-border text-nmsc-textSecondary font-semibold">
                                        <tr>
                                            <th className="p-4">Rank</th>
                                            <th className="p-4">Student Name</th>
                                            <th className="p-4">Roll Number</th>
                                            <th className="p-4">Eligible Subject</th>
                                            <th className="p-4">City</th>
                                            <th className="p-4">Marks Obtained</th>
                                            <th className="p-4">Percentage</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-nmsc-border text-nmsc-textPrimary">
                                        {MERIT_LEADERBOARD.map((item) => (
                                            <tr key={item.rank} className="hover:bg-nmsc-card/50 transition-colors">
                                                <td className="p-4 font-mono font-bold">
                                                    <span className={`w-7 h-7 rounded-full inline-flex items-center justify-center text-xs font-black ${
                                                        item.rank === 1 ? 'bg-amber-400 text-black' :
                                                        item.rank === 2 ? 'bg-slate-300 text-black' :
                                                        item.rank === 3 ? 'bg-amber-700 text-white' : 'bg-nmsc-bg text-nmsc-textSecondary border border-nmsc-border'
                                                    }`}>
                                                        #{item.rank}
                                                    </span>
                                                </td>
                                                <td className="p-4 font-bold text-white">{item.name}</td>
                                                <td className="p-4 font-mono text-nmsc-cyan">{item.roll}</td>
                                                <td className="p-4 text-emerald-400 font-medium">Biology</td>
                                                <td className="p-4 text-nmsc-textSecondary">{item.city}</td>
                                                <td className="p-4 font-mono font-bold text-white">{item.score} / 60</td>
                                                <td className="p-4 font-mono text-emerald-400 font-bold">{item.percentage}%</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const CertificateVerifyPage = () => {
            const [certId, setCertId] = useState('BIO-2026-10179');
            const [verifiedCert, setVerifiedCert] = useState({
                id: 'BIO-2026-10179',
                holder: 'Student Candidate',
                roll: 'MHS-2026-10179',
                achievement: 'National Biology Merit Rank #42 (51/60 Marks)',
                issueDate: 'October 2026',
                status: 'VERIFIED_GENUINE'
            });

            return (
                <div className="max-w-4xl mx-auto px-4 py-12 space-y-8">
                    <div className="text-center space-y-2">
                        <span className="text-xs font-mono text-nmsc-cyan">NATIONAL CERTIFICATION REGISTRY</span>
                        <h1 className="text-3xl font-black text-white">Certificate Verification System</h1>
                        <p className="text-xs text-nmsc-textSecondary">Verify authenticity of issued Biology assessment credentials.</p>
                    </div>

                    <div className="bg-nmsc-surface border border-nmsc-border rounded-2xl p-6 sm:p-8 space-y-6">
                        <div className="flex gap-2 max-w-md mx-auto">
                            <input
                                type="text"
                                value={certId}
                                onChange={e => setCertId(e.target.value)}
                                className="flex-1 bg-nmsc-bg border border-nmsc-border rounded-xl px-4 py-3 text-xs text-white font-mono outline-none focus:border-nmsc-cyan"
                                placeholder="Enter Certificate ID (e.g. BIO-2026-10179)"
                            />
                            <button
                                onClick={() => {
                                    setVerifiedCert({
                                        id: certId,
                                        holder: 'Verified Biology Candidate',
                                        roll: 'MHS-2026-101XX',
                                        achievement: 'Qualified National Biology Merit Score',
                                        issueDate: 'October 2026',
                                        status: 'VERIFIED_GENUINE'
                                    });
                                }}
                                className="px-6 py-3 bg-nmsc-cyan text-black font-bold text-xs rounded-xl hover:brightness-110"
                            >
                                Verify ID
                            </button>
                        </div>

                        {verifiedCert && (
                            <div className="bg-nmsc-bg border-2 border-emerald-500/40 rounded-2xl p-8 space-y-6 text-center relative overflow-hidden">
                                <div className="inline-flex items-center px-4 py-1.5 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-500/40 text-xs font-mono font-bold">
                                    ✓ OFFICIAL CREDENTIAL VERIFIED
                                </div>

                                <div className="space-y-2">
                                    <h2 className="text-2xl font-extrabold text-white">{verifiedCert.holder}</h2>
                                    <p className="text-xs text-nmsc-cyan font-mono">{verifiedCert.achievement}</p>
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-4 text-xs font-mono text-left max-w-lg mx-auto bg-nmsc-card p-4 rounded-xl border border-nmsc-border">
                                    <div><span className="text-nmsc-textSecondary text-[10px] block">Certificate ID</span><strong className="text-white">{verifiedCert.id}</strong></div>
                                    <div><span className="text-nmsc-textSecondary text-[10px] block">Roll Number</span><strong className="text-white">{verifiedCert.roll}</strong></div>
                                    <div><span className="text-nmsc-textSecondary text-[10px] block">Issued On</span><strong className="text-white">{verifiedCert.issueDate}</strong></div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const SchoolPortal = () => {
            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-8">
                    <div className="bg-nmsc-surface border border-nmsc-border rounded-3xl p-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <span className="text-xs font-mono text-nmsc-purple">INSTITUTIONAL DASHBOARD</span>
                            <h1 className="text-2xl sm:text-3xl font-black text-white">National Science Academy</h1>
                            <p className="text-xs text-nmsc-textSecondary mt-1">School Code: <span className="text-white font-mono">SCH-2026-991</span></p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 text-xs">
                        <div className="bg-nmsc-card p-5 rounded-2xl border border-nmsc-border">
                            <span className="text-nmsc-textSecondary">Registered Biology Candidates</span>
                            <div className="text-2xl font-black text-white font-mono mt-1">42 Students</div>
                        </div>
                        <div className="bg-nmsc-card p-5 rounded-2xl border border-nmsc-border">
                            <span className="text-nmsc-textSecondary">Qualified Candidates</span>
                            <div className="text-2xl font-black text-emerald-400 font-mono mt-1">39 Candidates</div>
                        </div>
                        <div className="bg-nmsc-card p-5 rounded-2xl border border-nmsc-border">
                            <span className="text-nmsc-textSecondary">School National Rank</span>
                            <div className="text-2xl font-black text-nmsc-cyan font-mono mt-1">#4 Nationwide</div>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminPortal = ({ showToast }) => {
            const [pendingPayments, setPendingPayments] = useState([
                { id: 'PAY-101', name: 'Zainab Bibi', roll: 'MHS-2026-9012', amount: 500, txn: 'TXN-8812993', status: 'Pending' }
            ]);

            const approvePayment = (id) => {
                setPendingPayments(prev => prev.filter(p => p.id !== id));
                showToast(`Payment ${id} approved.`, 'success');
            };

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-8">
                    <div className="bg-nmsc-surface border border-nmsc-border rounded-3xl p-8 flex justify-between items-center">
                        <div>
                            <span className="text-xs font-mono text-amber-400">ADMINISTRATOR CONTROL CONSOLE</span>
                            <h1 className="text-2xl font-black text-white">Biology Exam Operations</h1>
                        </div>
                        <span className="px-3 py-1 bg-amber-950 text-amber-400 border border-amber-500/30 text-xs font-mono rounded-full font-bold">SUPER ADMIN</span>
                    </div>

                    <div className="bg-nmsc-surface border border-nmsc-border rounded-2xl p-6 space-y-4">
                        <h3 className="font-bold text-white text-sm">Pending Payment Verification</h3>

                        {pendingPayments.length === 0 ? (
                            <p className="text-xs text-nmsc-textSecondary">All pending records processed.</p>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-xs">
                                    <thead className="bg-nmsc-card text-nmsc-textSecondary font-semibold">
                                        <tr>
                                            <th className="p-3">Ref ID</th>
                                            <th className="p-3">Student</th>
                                            <th className="p-3">Roll No</th>
                                            <th className="p-3">Amount</th>
                                            <th className="p-3">Txn ID</th>
                                            <th className="p-3">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-nmsc-border">
                                        {pendingPayments.map(p => (
                                            <tr key={p.id}>
                                                <td className="p-3 font-mono text-nmsc-textSecondary">{p.id}</td>
                                                <td className="p-3 font-bold text-white">{p.name}</td>
                                                <td className="p-3 font-mono text-nmsc-cyan">{p.roll}</td>
                                                <td className="p-3 font-mono text-emerald-400">PKR {p.amount}</td>
                                                <td className="p-3 font-mono text-nmsc-textSecondary">{p.txn}</td>
                                                <td className="p-3">
                                                    <button onClick={() => approvePayment(p.id)} className="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded">
                                                        Approve
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Toast = ({ toast, onClose }) => {
            if (!toast) return null;

            const bgColors = {
                info: 'bg-nmsc-card border-nmsc-cyan text-nmsc-cyan',
                success: 'bg-emerald-950 border-emerald-500 text-emerald-400',
                warning: 'bg-amber-950 border-amber-500 text-amber-400',
                error: 'bg-red-950 border-red-500 text-red-400'
            };

            return (
                <div className="fixed bottom-6 right-6 z-50 max-w-md w-full animate-bounce">
                    <div className={`p-4 rounded-xl border shadow-2xl flex items-center justify-between text-xs font-semibold ${bgColors[toast.type] || bgColors.info}`}>
                        <span>{toast.message}</span>
                        <button onClick={onClose} className="ml-4 font-bold hover:opacity-75">✕</button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeView, setActiveView] = useState('results');
            const [currentRole, setRole] = useState('student');
            const [toast, setToast] = useState(null);

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            return (
                <div className="min-h-screen flex flex-col bg-nmsc-bg">
                    {activeView !== 'exam_hall' && (
                        <Navbar
                            activeView={activeView}
                            setActiveView={setActiveView}
                            currentRole={currentRole}
                            setRole={setRole}
                        />
                    )}

                    <main className="flex-1">
                        {activeView === 'home' && <HomePage setActiveView={setActiveView} />}
                        {activeView === 'subjects' && <HomePage setActiveView={setActiveView} />}
                        {activeView === 'register' && <RegistrationFlow setActiveView={setActiveView} showToast={showToast} />}
                        {activeView === 'student_dashboard' && <StudentDashboard setActiveView={setActiveView} />}
                        {activeView === 'exam_hall' && <ExamHall setActiveView={setActiveView} showToast={showToast} />}
                        {activeView === 'results' && <ResultsPage />}
                        {activeView === 'schedule' && <HomePage setActiveView={setActiveView} />}
                        {activeView === 'verify' && <CertificateVerifyPage />}
                        {activeView === 'school_portal' && <SchoolPortal />}
                        {activeView === 'admin_portal' && <AdminPortal showToast={showToast} />}
                    </main>

                    <Toast toast={toast} onClose={() => setToast(null)} />
                </div>
            );
        };

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
